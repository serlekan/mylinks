<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080808" />
    <meta
      name="description"
      content="Links to my work, projects and social profiles."
    />
    <title>MyLinks</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body class="landing">
    <a class="skip" href="#links" tabindex="0">Skip to links</a>
    <main class="shell">
      <header class="topline">
        <span id="brand">MYLINKS / LINK HUB</span
        ><span class="status"
          ><span class="status-dot" aria-hidden="true"></span
          ><span id="status">Building</span></span
        >
      </header>
      <section class="hero" aria-label="Profile">
        <div class="eyebrow" id="eyebrow"></div>
        <h1 id="name">MyLinks.</h1>
        <p class="intro" id="intro"></p>
      </section>
      <nav
        class="links"
        id="links"
        aria-label="My links"
        aria-busy="true"
      ></nav>
      <p class="notice" id="notice" role="status" hidden></p>
      <footer>
        <span id="footer-note"></span
        ><span class="footer-right"
          >© <span id="year"></span> <span id="footer-name">MyLinks</span
          ><a
            class="manage-link"
            href="./editor.html"
            aria-label="Manage this link page"
            >Manage</a
          ></span
        >
      </footer>
    </main>
  </body>
</html>
